[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "street-view-cleaner"
version = "1.0.0"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "pillow>=10.0", "opencv-python-headless>=4.10", "numpy>=1.26", "httpx>=0.27", "pydantic-settings>=2.0", "google-cloud-vision>=3.7"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]
vision = ["google-cloud-vision>=3.7"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
