[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "street-view-cleaner"
version = "1.1.0"
description = "Local Windows-first Street View UI cleanup application for removing overlays while preserving real-world scene content."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "arfbae" }]
keywords = ["street-view", "image-cleanup", "fastapi", "windows", "opencv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
vision = [
    "google-cloud-vision>=3.7",
]

[project.scripts]
street-view-cleaner = "backend.app.main:main"

[project.urls]
Homepage = "https://github.com/arfbae/street-view-cleaner"
Repository = "https://github.com/arfbae/street-view-cleaner"
Issues = "https://github.com/arfbae/street-view-cleaner/issues"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["**/*.html", "**/*.js", "**/*.css", "**/*.json"]
