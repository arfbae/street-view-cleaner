<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Street View Cleaner - Windows Local</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="card"><h1>Street View Cleaner</h1><p>Windows localhost pipeline. Choose Street View or Instagram Cleaner Mode. Remove UI only; preserve real-world objects. Uncertain results are sent to manual review.</p><section class="controls"><label>Images<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><label>Provider<select id="provider"><option value="mock">Mock (safe test)</option><option value="qwen_local">Qwen Local</option><option value="nano_banana">Nano Banana</option></select></label><label>Processing mode<select id="preset"><option value="preserve_scene">Preserve Scene</option><option value="clean_mode">Clean Mode</option><option value="keep_sky">Keep Sky</option><option value="keep_edges">Keep Edges</option><option value="instagram_screenshot_cleaner">Instagram Cleaner Mode</option></select></label><div class="toolbar"><button id="go">Run Batch</button><button id="rerun" type="button">Re-run</button><a id="download" class="button" hidden>Download ZIP</a></div></section><section><h2>Progress</h2><progress id="progress" value="0" max="1"></progress><div id="status" role="status"></div></section><section><h2>Preview Grid</h2><div id="grid" class="grid"><p class="muted">Processed images will appear here.</p></div></section></main><script type="module" src="/static/app.js"></script></body></html>
