version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: street-view-cleaner-backend
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env:ro
      # If using Google Vision local credential files, mount them securely:
      - c:\Users:/root/.gcp:ro  # Adjust path matching your .env file
    environment:
      - ENV_MODE=production
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    image: nginx:alpine
    container_name: street-view-cleaner-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
